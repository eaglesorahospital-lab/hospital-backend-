user nginx;
pid /var/run/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured access logging with client IP and proxy headers
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression for text, JSON, CSS, and JS assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Docker embedded DNS resolver with 5s cache validity
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 20M;

        set $backend_service "http://backend:8000";

        # Lightweight health check endpoint for Nginx probe
        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"hospital-platform-nginx"}';
        }

        # Django REST API & Health Check routing
        location /api/ {
            proxy_pass $backend_service$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # React Admin SPA routes (operations dashboard subroutes)
        location ~ ^/admin/(schedules|doctors|departments|appointments|patients|content|notifications|administrators|audit)/?$ {
            root /var/www/frontend;
            try_files $uri $uri/ /index.html;
            index index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Django Admin routing (Django built-in administration)
        location /admin/ {
            proxy_pass $backend_service$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Django collected static files
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Media assets
        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # React Frontend SPA (static assets with client-side routing fallback)
        location / {
            root /var/www/frontend;
            try_files $uri $uri/ /index.html;
            index index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }
    }
}
